<!-- PAGE A PROPOS -->
<section class="relative h-[350px] w-full bg-black overflow-hidden">
<img src="images/2149504791.jpg" class="h-full w-full object-cover absolute z-0 opacity-30"/>
  <div class="absolute inset-0 bg-gradient-to-t from-blue-900 to-transparent z-10"></div>
 
</section>


<section class="bg-blue-900 py-20">
  <div class="container mx-auto px-6">
    <div class="grid lg:grid-cols-2 gap-12 items-center">

      <!-- LEFT : TEXTE -->
      <div class="text-white">
        <h2 class="text-3xl lg:text-4xl font-bold mb-4">
          Contactez-nous
        </h2>
        <p class="text-blue-200 mb-6 leading-relaxed">
          Nous sommes prêts à discuter de votre projet et à vous accompagner
          avec des solutions digitales professionnelles et efficaces.
        </p>

        <div class="space-y-4">
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-envelope text-blue-300"></i>
            <span>contact&#64;ong-appd.org</span>
          </div>
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-phone text-blue-300"></i>
            <span>+243 XXX XXX XXX</span>
          </div>
          <div class="flex items-center gap-3">
            <i class="fa-solid fa-location-dot text-blue-300"></i>
            <span>Kinshasa, RDC</span>
          </div>
        </div>
      </div>

      <!-- RIGHT : FORM -->
      <div class="bg-white/10 backdrop-blur-lg p-8 rounded-xl shadow-lg">
        <form class="space-y-5">

          <!-- NOM -->
          <div>
            <label class="text-white text-sm mb-1 block">Nom</label>
            <div class="relative">
              <i class="fa-solid fa-user absolute left-3 top-1/2 -translate-y-1/2 text-blue-300"></i>
              <input
                type="text"
                placeholder="Votre nom"
                class="w-full h-[45px] pl-10 pr-4 rounded-md bg-transparent border border-blue-300/40 text-white placeholder-blue-200 focus:outline-none focus:border-white"
              />
            </div>
          </div>

          <!-- EMAIL -->
          <div>
            <label class="text-white text-sm mb-1 block">Email</label>
            <div class="relative">
              <i class="fa-solid fa-envelope absolute left-3 top-1/2 -translate-y-1/2 text-blue-300"></i>
              <input
                type="email"
                placeholder="Votre email"
                class="w-full h-[45px] pl-10 pr-4 rounded-md bg-transparent border border-blue-300/40 text-white placeholder-blue-200 focus:outline-none focus:border-white"
              />
            </div>
          </div>

          <!-- OBJET -->
          <div>
            <label class="text-white text-sm mb-1 block">Objet</label>
            <div class="relative">
              <i class="fa-solid fa-pen absolute left-3 top-1/2 -translate-y-1/2 text-blue-300"></i>
              <input
                type="text"
                placeholder="Objet du message"
                class="w-full h-[45px] pl-10 pr-4 rounded-md bg-transparent border border-blue-300/40 text-white placeholder-blue-200 focus:outline-none focus:border-white"
              />
            </div>
          </div>

          <!-- MESSAGE -->
          <div>
            <label class="text-white text-sm mb-1 block">Message</label>
            <div class="relative">
              <i class="fa-solid fa-message absolute left-3 top-4 text-blue-300"></i>
              <textarea
                rows="4"
                placeholder="Votre message"
                class="w-full pl-10 pr-4 pt-3 rounded-md bg-transparent border border-blue-300/40 text-white placeholder-blue-200 focus:outline-none focus:border-white"
              ></textarea>
            </div>
          </div>

          <!-- BUTTON -->
          <button
            type="submit"
            class="w-full h-[45px] bg-white text-blue-900 font-semibold rounded-md hover:bg-blue-100 transition flex items-center justify-center gap-2"
          >
            <i class="fa-solid fa-paper-plane"></i>
            Envoyer le message
          </button>

        </form>
      </div>

    </div>
  </div>
</section>
